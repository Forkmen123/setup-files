# ~/.config/kitty/kitty.conf

# -----------------------------------------------------------------------------
# FONTS
# Alacritty: "CaskaydiaMono Nerd Font", Size 18.0
# -----------------------------------------------------------------------------
font_family      CaskaydiaMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# -----------------------------------------------------------------------------
# WINDOW DECORATIONS & LAYOUT
# Alacritty: Padding 10, Buttonless, Opacity 0.8, Blur True
# -----------------------------------------------------------------------------
# Adds 10px padding on all sides
window_padding_width 10

# "hide_window_decorations titlebar-only" is the closest equivalent to
# Alacritty's "Buttonless" on macOS (removes the gray bar and buttons).
hide_window_decorations titlebar-only

# MacOS specific transparency and blur settings
background_opacity 0.8
background_blur 20
remember_window_size yes

# -----------------------------------------------------------------------------
# ENVIRONMENT
# Alacritty: TERM = "xterm-256color"
# -----------------------------------------------------------------------------
term xterm-256color

# -----------------------------------------------------------------------------
# COLORS (TOKYO NIGHT CUSTOM)
# Mapped directly from your Alacritty [colors] section
# -----------------------------------------------------------------------------

# Primary
background #15161e
foreground #f7ebf6

# Cursor (Optional: matches text)
cursor #f7ebf6
cursor_text_color #15161e

# Normal Colors (0-7)
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #ffc777
color4 #7aa2f7
color5 #d65d7e
color6 #2ac3de
color7 #f7ebf6

# Bright Colors (8-15)
color8  #414868
color9  #ff9e64
color10 #b9f27c
color11 #e0af68
color12 #5d90ff
color13 #e68aab
color14 #7dcfff
color15 #f7ebf6